<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Whitehat Challenge A{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <span>Whitehat Challenge A</span>
      <span class="badge">Demo</span>
    </div>
    <nav class="site-nav">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('insert') }}">Insert</a>
      <a href="#" class="disabled">Search</a>
    </nav>
  </header>

  {# Dev-mode banner (will be removed in step 6 when debug=False) #}
  <div class="dev-banner">
    Development mode — debug enabled, intentionally vulnerable until step 6
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Built with <code>Flask 3.1</code> &middot; <code>Python 3.14</code> &middot; <code>SQLite</code>
  </footer>

</body>
</html>
